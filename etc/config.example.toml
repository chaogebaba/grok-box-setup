# box-setup configuration.
#
# install.sh seeds this to /workspace/box-setup/config.toml on first install
# and never overwrites it afterwards, so your edits survive an upgrade.
# It lives under /workspace, so it also survives an image swap.
#
# Re-read on every converge. After editing:
#   sudo /workspace/box-setup/boxup once
#
# Read by a small awk reader in boxup, not a full TOML library. Supported:
# [table] headers, "basic strings" (with \\ and \" escapes), 'literal
# strings', bare values, and # comments. One level of tables.

[ssh]
# Password for root and box.
#
# Re-applied on every converge, because the Grok image ships both accounts
# with a locked shadow entry (* or !) and an image swap wipes /etc/shadow.
# Without this, sshd is up but no login works.
#
# Leave commented for the default: 12345678
#password = "12345678"
#
# To override for a single run without editing this file:
#   sudo BOX_SSH_PASSWORD='s3cret' /workspace/box-setup/boxup once
#
# Any printable value is accepted, including spaces and ':'. An empty or
# non-printable value is refused and the default is used instead.

[tailscale]
# Pin the vendored tailscale version. When set and different from what is in
# bin/, the official static tarball for this version is downloaded on the
# next converge. Leave commented to keep whatever bin/ already has (the
# built-in default is only used when bin/ is empty).
#version = "1.102.3"
#
# Tags advertised at FIRST login only (empty statedir — which INCLUDES a
# state-loss REJOIN after an image swap, not just a brand-new box). When set,
# boxup adds --advertise-tags=<value> to the initial `tailscale up`. Tagging AT
# AUTHENTICATION TIME is the ONLY path that disables node-key expiry
# automatically (Tailscale key-expiry docs); tagging later in the console does
# NOT. It is NEVER added on the ~180-day key-expiry re-auth (--force-reauth)
# path, and never appears in `tailscale set`. Retagging an already-registered
# node is `boxup retag` (see docs/AGENT.md §G).
#
# DEFAULT is `tag:grok-box`: a MISSING key resolves to `tag:grok-box` in the
# code, so a box registers TAGGED + expiry-disabled by default (this line is
# uncommented for exactly that reason). To register UNTAGGED on purpose, set it
# to the EMPTY string explicitly — `tags = ""` — which boxup treats as a
# deliberate opt-out and logs once at first login.
#
# ORDERING (do not skip): the tailnet ACL tagOwners/autoApprovers for this tag
# MUST exist BEFORE you seed this key into any box's config.toml — the
# empty-statedir branch is also the state-lost recovery path, and a box
# rebuilding its identity with an unauthorized tag cannot rejoin at all. If the
# seeded auth key itself carries tags, they must match this value.
tags = "tag:grok-box"

[update]
# Repo cloned by `boxup update`. Always a fresh clone to a temp dir + this
# install.sh — never `git pull` in place.
#repo = "https://github.com/chaogebaba/grok-box-setup.git"

[keepawake]
# boxup-keepawake K1/K2. The box platform pauses a box after an idle window
# keyed to AGENT TURNS, and a paused box is invisible to the brain. This makes
# the box keep ITSELF awake: every `interval_min` minutes the worker asks the
# local gateway (127.0.0.1:1340) to run one minimal agent turn.
#
# COST: this is a real model turn and it spends the account's quota — 72 a day
# per box at the default cadence. That is why the mechanism measures itself:
# /workspace/boxup-keepawake.log records every attempt and its outcome, and
# tests/keepawake-readout.sh turns the fleet's logs into the KEEP/ABANDON table.
#
#   0            OFF. The guard becomes a no-op (one "keepawake: off" line an
#                hour) and costs nothing. This is the ABANDON setting, and the
#                brain can push it fleet-wide through managed.toml.
#   1..9         silently raised to 10 — the floor exists because the cost is
#                per fire, and `interval_min = 1` would be 1440 turns a day.
#   20           default.
#
#interval_min = 20

[managed]
# FLEET-BRAIN config-truth escape hatch (docs/FLEET-BRAIN.md §config-truth).
#
# When the VPS brain manages this fleet it pushes a SEPARATE file,
# /workspace/box-setup/managed.toml (written only by the brain — hand edits are
# overwritten on the next reconcile). For any key present there, managed.toml
# WINS over this file: precedence is env > managed.toml > config.toml > default.
#
# Set `enabled = false` to make THIS box ignore managed.toml entirely — the
# brain still pushes and records the file, but boxup falls back to the
# config.toml value below (and logs "managed.toml ignored by local config" once
# per converge). `fleetctl config diff` annotates such a box as IGNORED and
# never reports it in-sync. Default (key absent) is true: the managed layer is
# on. This is the box-side escape hatch; the brain-side one is a per-box
# override in the brain's boxes/<box>.toml (see etc/fleet.example.toml).
#
# Missing managed.toml = today's behaviour exactly (config.toml only), so an
# un-managed fleet is unaffected whether or not this key is set.
#enabled = true

[fleet]
# FLEET-BRAIN out-of-band reverse-SSH tunnel (docs/FLEET-BRAIN.md §1).
#
# WRITTEN BY ENROLL — MANUAL EDIT ONLY FOR SPECIAL CASES. `fleetctl enroll
# grok-box-N` sets `vps` and `box_index` here itself (and `port`, but only when
# the VPS sshd port is non-default), over the same tailnet SSH session it uses
# to read the box's tunnel pubkey — so the tunnel comes up on the next
# `boxup once` with no manual edit. The address enroll writes comes from the
# BRAIN side (`FLEET_VPS_ADDR` env, else `[fleet-brain].vps` in the brain's
# config) — there is no baked default. You only touch this block by hand for
# SPECIAL cases (a manual re-point, or `fleetctl enroll --no-box-config` which
# skips the box-side write). After any manual edit:
#   sudo /workspace/box-setup/boxup once
#
# UNCONFIGURED BY DEFAULT: with `vps` unset, boxup does NOTHING here — no
# tunnel, no key use beyond generation — so an un-enrolled box is completely
# unaffected. These stay commented until enroll (or you) set them.
#
# vps        the always-on brain host the box dials out to. The box opens a
#            reverse tunnel  ssh -R 127.0.0.1:2000N:localhost:22 fleet@<vps>
#            supervised by the boxup tick (respawn with backoff, like
#            tailscaled). Liveness is client-driven (ServerAlive*), because the
#            VPS runs ClientAliveInterval 0 and never reaps a dead tunnel.
#vps = "203.0.113.10"
#
# port       the VPS sshd port (default 22). enroll writes it ONLY when the
#            brain's port (`FLEET_VPS_PORT` env / `[fleet-brain].vps_port`) is
#            non-default; at 22 the key is omitted and this default stands.
#port = 22
#
# box_index  N in grok-box-NNN (the decimal index; names are zero-padded to
#            three digits, e.g. grok-box-008). The reverse loopback port is
#            20000+N, N parsed as DECIMAL (a padded 008/009 is 8/9, never
#            octal). Leave unset to derive N from the frozen hostname.
#box_index = 8
