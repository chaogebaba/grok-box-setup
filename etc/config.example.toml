# box-setup configuration.
#
# install.sh seeds this to /workspace/box-setup/config.toml on first install
# and never overwrites it afterwards, so your edits survive an upgrade.
# It lives under /workspace, so it also survives an image swap.
#
# Re-read on every converge. After editing:
#   sudo /workspace/box-setup/boxup once
#
# Read by a small awk reader in boxup, not a full TOML library. Supported:
# [table] headers, "basic strings" (with \\ and \" escapes), 'literal
# strings', bare values, and # comments. One level of tables.

[ssh]
# Password for root and box.
#
# Re-applied on every converge, because the Grok image ships both accounts
# with a locked shadow entry (* or !) and an image swap wipes /etc/shadow.
# Without this, sshd is up but no login works.
#
# Leave commented for the default: 12345678
#password = "12345678"
#
# To override for a single run without editing this file:
#   sudo BOX_SSH_PASSWORD='s3cret' /workspace/box-setup/boxup once
#
# Any printable value is accepted, including spaces and ':'. An empty or
# non-printable value is refused and the default is used instead.

[tailscale]
# Pin the vendored tailscale version. When set and different from what is in
# bin/, the official static tarball for this version is downloaded on the
# next converge. Leave commented to keep whatever bin/ already has (the
# built-in default is only used when bin/ is empty).
#version = "1.102.3"
#
# Tags advertised at FIRST login only (empty statedir). When set, boxup adds
# --advertise-tags=<value> to the initial `tailscale up`. It is NEVER added on
# the ~180-day key-expiry re-auth (--force-reauth) path, and never appears in
# `tailscale set`. Retagging an already-registered node is a MANUAL operator
# step — see docs/AGENT.md §F.
#
# ORDERING (do not skip): the tailnet ACL tagOwners/autoApprovers for this tag
# MUST exist BEFORE you seed this key into any box's config.toml — the
# empty-statedir branch is also the state-lost recovery path, and a box
# rebuilding its identity with an unauthorized tag cannot rejoin at all. If the
# seeded auth key itself carries tags, they must match this value.
#tags = "tag:grok-box"

[update]
# Repo cloned by `boxup update`. Always a fresh clone to a temp dir + this
# install.sh — never `git pull` in place.
#repo = "https://github.com/chaogebaba/grok-box-setup.git"

[fleet]
# FLEET-BRAIN out-of-band reverse-SSH tunnel (docs/FLEET-BRAIN.md §1).
#
# WRITTEN BY ENROLL: `fleetctl enroll grok-box-N` now sets `vps` and `box_index`
# here itself, over the same tailnet SSH session it uses to read the box's
# tunnel pubkey — so the tunnel comes up on the next `boxup once` with no manual
# edit. You only touch this block by hand for SPECIAL cases (a non-default VPS
# address, a manual re-point, or `fleetctl enroll --no-box-config` which skips
# the box-side write). After any manual edit:  sudo /workspace/box-setup/boxup once
#
# UNCONFIGURED BY DEFAULT: with `vps` unset, boxup does NOTHING here — no
# tunnel, no key use beyond generation — so an un-enrolled box is completely
# unaffected. These stay commented until enroll (or you) set them.
#
# vps        the always-on brain host the box dials out to. The box opens a
#            reverse tunnel  ssh -R 127.0.0.1:2000N:localhost:22 fleet@<vps>
#            supervised by the boxup tick (respawn with backoff, like
#            tailscaled). Liveness is client-driven (ServerAlive*), because the
#            VPS runs ClientAliveInterval 0 and never reaps a dead tunnel.
#vps = "107.172.132.211"
#
# port       the VPS sshd port (default 22).
#port = 22
#
# box_index  N in grok-box-N; the reverse loopback port is 20000+N (range
#            20001–20008). Leave unset to derive N from the frozen hostname.
#box_index = 8
