name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: |
          set -e
          # Keep this list in step with the Makefile `lint` target. It named
          # the retired bash `fleetctl` (deleted in the phase-3 cutover, so this
          # step could only fail) and omitted vps/install-vps.sh and the two
          # release scripts that the Makefile already covers.
          bash -n boxup
          bash -n install.sh
          bash -n box-bootstrap.sh
          bash -n vps/install-vps.sh
          bash -n fleet/scripts/release-build.sh
          bash -n fleet/scripts/release-publish.sh
          bash -n tests/test-rename-allowlist.sh
      - name: shellcheck
        run: |
          set -e
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning boxup install.sh box-bootstrap.sh vps/install-vps.sh \
            fleet/scripts/release-build.sh fleet/scripts/release-publish.sh
      - name: version match
        run: |
          set -e
          # VERSION file and boxup's BOXUP_VERSION are two independent copies;
          # they must not drift (D10).
          file_v="$(tr -d '[:space:]' < VERSION)"
          boxup_v="$(sed -n 's/^BOXUP_VERSION=//p' boxup | head -1 | tr -d '[:space:]')"
          echo "VERSION=$file_v BOXUP_VERSION=$boxup_v"
          test "$file_v" = "$boxup_v" || { echo "VERSION ($file_v) != BOXUP_VERSION ($boxup_v)" >&2; exit 1; }
      - name: boxup tail sentinel
        run: |
          set -e
          # D5: the shim's corruption predicate needs '# boxup-eof' as the
          # literal last line of boxup. Catch an accidental post-sentinel
          # append in the PR, not mid-rollout.
          test "$(tail -n1 boxup)" = '# boxup-eof' || { echo "boxup lost its tail sentinel" >&2; exit 1; }
      - name: no identity leaked
        run: |
          set -e
          test ! -f hostname
          test ! -f secrets/ts-authkey
          test ! -f state/tailscale/tailscaled.state
          if git ls-files | grep -E 'tailscaled\.state$|ts-authkey$|^hostname$'; then
            echo "refusing to ship box identity" >&2
            exit 1
          fi
