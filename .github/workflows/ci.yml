name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: |
          set -e
          bash -n boxup
          bash -n fleetctl
          bash -n install.sh
          bash -n box-bootstrap.sh
      - name: shellcheck
        run: |
          set -e
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning boxup fleetctl install.sh box-bootstrap.sh
      - name: no identity leaked
        run: |
          set -e
          test ! -f hostname
          test ! -f secrets/ts-authkey
          test ! -f state/tailscale/tailscaled.state
          if git ls-files | grep -E 'tailscaled\.state$|ts-authkey$|^hostname$'; then
            echo "refusing to ship box identity" >&2
            exit 1
          fi
