name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The bash half. Deliberately bun-free (blueprint D1): this job is what proves
  # the shell side still works on a machine that has no bun at all.
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: sudo apt-get install -y -qq shellcheck
      - name: lint
        # `make lint` owns the file list. This step used to duplicate it inline
        # with a comment asking the two to be kept in step by hand — and they had
        # already drifted: the copy here named the retired bash `fleetctl` and
        # omitted three scripts the Makefile covers. Calling make makes drift
        # impossible instead of asking someone to notice it.
        run: make lint
      - name: shell test suite
        # Never ran in CI before. These are the boxup / installer / rename /
        # Makefile-binding suites; they need only bash + coreutils.
        run: make test
      - name: version match
        run: |
          set -e
          # VERSION file and boxup's BOXUP_VERSION are two independent copies;
          # they must not drift (D10).
          file_v="$(tr -d '[:space:]' < VERSION)"
          boxup_v="$(sed -n 's/^BOXUP_VERSION=//p' boxup | head -1 | tr -d '[:space:]')"
          echo "VERSION=$file_v BOXUP_VERSION=$boxup_v"
          test "$file_v" = "$boxup_v" || { echo "VERSION ($file_v) != BOXUP_VERSION ($boxup_v)" >&2; exit 1; }
      - name: boxup tail sentinel
        run: |
          set -e
          # D5: the shim's corruption predicate needs '# boxup-eof' as the
          # literal last line of boxup. Catch an accidental post-sentinel
          # append in the PR, not mid-rollout.
          test "$(tail -n1 boxup)" = '# boxup-eof' || { echo "boxup lost its tail sentinel" >&2; exit 1; }
      - name: no identity leaked
        run: |
          set -e
          test ! -f hostname
          test ! -f secrets/ts-authkey
          test ! -f state/tailscale/tailscaled.state
          if git ls-files | grep -E 'tailscaled\.state$|ts-authkey$|^hostname$'; then
            echo "refusing to ship box identity" >&2
            exit 1
          fi

  # The grokfleet (bun + TS) half — the brain engine, the API and the TUI. None
  # of this was gated before: a type error, a dead import or a failing unit test
  # could reach main and only surface on the VPS.
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not "latest": the runtime that runs the tests is part of the
          # result. Bump it deliberately.
          bun-version: 1.4.1
      - name: deps
        # --frozen-lockfile (via ts-deps): a dependency edit that forgot to
        # commit fleet/bun.lock fails here rather than resolving something else.
        run: make ts-deps
      - name: typecheck
        run: make ts-typecheck
      - name: lint
        run: make ts-lint
      - name: test
        run: make ts-test

  # The release binary must actually compile. Cheap (~1 s) and it catches a
  # bundler-level break that neither tsc nor the test runner sees.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: build
        run: make ts-build
      - name: version smoke
        run: ./fleet/dist/grokfleet version
      - name: TUI pty smoke
        # tests/test-makefile-targets.sh SKIPs its pty cases unless
        # fleet/dist/grokfleet exists, so in the bash job (which never builds)
        # they never run. Re-running that ONE script here — with the binary
        # present — is what actually exercises them.
        run: bash tests/test-makefile-targets.sh
